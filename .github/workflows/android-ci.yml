name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build production and demo APKs
        run: >-
          ./gradlew --no-daemon
          :app:testProdDebugUnitTest
          :app:testDemoDebugUnitTest
          :app:assembleProdDebug
          :app:assembleDemoDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: iphotos-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/prod/debug/app-prod-debug.apk
            app/build/outputs/apk/demo/debug/app-demo-debug.apk
          if-no-files-found: error
          retention-days: 14
